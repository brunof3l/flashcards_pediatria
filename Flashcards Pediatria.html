<div style="display:flex;justify-content:space-between;align-items:center"><div><h1>🩺 Pediatria · Prova Prática</h1><div class="s">Neonatologia & UTI · toque no cartão para virar</div></div><button class="b g" id="th">🌓</button></div>

<p class="s" style="margin-top:14px">Material de estudo. Confirmar doses e condutas com o protocolo da UTI e os preceptores.</p>

<script>
var D=[
["Caso 28 sem","Como o RN é classificado pela idade gestacional ao nascer? Liste as faixas em semanas e diga onde cai um RN de 28 semanas.","<b>Pré-termo extremo</b> &lt;28s · <b>Muito prematuro 28 a &lt;32s (o caso)</b> · Moderado 32 a &lt;34s · Tardio 34 a &lt;37s · Termo 37 a &lt;42s · Pós-termo ≥42s"],
["Caso 28 sem","Como o RN é classificado pelo peso ao nascer? Dê o nome e o limite em gramas de cada categoria e classifique um RN de 800 g.","BPN &lt;2500 g · MBPN &lt;1500 g · <b>EBPN &lt;1000 g (o caso, 800 g)</b>"],
["Caso 28 sem","O que significam PIG, AIG e GIG? Qual ferramenta você usa para classificar e como aplicar no RN de 28 semanas com 800 g?","Plotar em curva (Fenton/Intergrowth). <b>PIG &lt;p10</b> · AIG p10 a p90 · <b>GIG &gt;p90</b>. Para 28s e 800 g, está perto do limite AIG/PIG: dizer que precisa plotar."],
["Caso 28 sem","Caso: RN de 28 semanas, 800 g, com quadro respiratório que melhorou após cafeína. Qual a sua hipótese diagnóstica e por quê?","<b>Apneia da prematuridade</b> (imaturidade do centro respiratório), frequentemente associada a <b>SDR/doença da membrana hialina</b>. A cafeína trata a apneia e ajuda na extubação."],
["Caso 28 sem","No mesmo caso (RN de 28 semanas com apneia/desconforto), quais diagnósticos diferenciais você deve citar?","Sepse/pneumonia (SGB) · TTRN · pneumotórax · hemorragia peri-intraventricular · convulsão (apneia) · cardiopatia/PCA · hipoglicemia/hipocalcemia · anemia · obstrução de via aérea"],
["Caso 28 sem","Como se define apneia da prematuridade (tempo, FC) e por que ela é um diagnóstico de exclusão?","Pausa ≥20 s, ou menor com <b>bradicardia (FC &lt;100)</b>, cianose ou palidez. <b>Diagnóstico de exclusão</b>: descartar sepse, hipoglicemia, convulsão, HPIV."],
["Caso 28 sem","Sobre a cafeína no prematuro: como ela age, quando indicar, qual a dose (ataque e manutenção) e quais os efeitos adversos?","<b>Antagonista da adenosina</b>: estimula centro respiratório, aumenta sensibilidade ao CO₂, melhora diafragma.<br>Citrato: <b>ataque 20 mg/kg</b>, manutenção 5 a 10 mg/kg/dia.<br>Indicada &lt;34s ou &lt;1500 g e para extubar. Estudo CAP: menos DBP, PCA e melhor neurodesenvolvimento.<br>Efeitos: taquicardia, irritabilidade, intolerância alimentar. Rever se FC &gt;180."],
["Caso 28 sem","Você precisa dar uma má notícia aos pais na UTI neonatal. Quais são as 6 etapas do protocolo SPIKES e o que fazer em cada uma?","<b>S</b>etting (local reservado, sentados, pais juntos) · <b>P</b>erception (o que já entendem?) · <b>I</b>nvitation (quanto querem saber?) · <b>K</b>nowledge (linguagem simples, em partes) · <b>E</b>motions (NURSE: nomear, entender, respeitar, apoiar, explorar) · <b>S</b>trategy/Summary (resumo e plano)"],
["Sepse","Qual a diferença entre sepse neonatal precoce e tardia (tempo de início e forma de aquisição)? Como reclassificar o paciente que piora após dias internado?","<b>Precoce:</b> início ≤72 h (alguns serviços 48 h), transmissão <b>vertical</b> (canal de parto).<br><b>Tardia:</b> &gt;72 h, origem <b>hospitalar</b> ou comunitária (cateter, VM, NPT, internação longa). Se o paciente piora após dias internado, reclassificar como tardia."],
["Sepse","Na sepse neonatal PRECOCE: quais os fatores de risco maternos/neonatais e quais os principais microrganismos?","<b>Fatores:</b> RPM &gt;18 h, febre materna, corioamnionite, ITU materna, SGB sem profilaxia adequada, prematuridade, BPN.<br><b>Agentes:</b> <b>SGB</b>, <b>E. coli</b>, Listeria."],
["Sepse","Na sepse neonatal TARDIA: quais os fatores de risco e quais os principais microrganismos?","<b>Fatores:</b> cateter central/umbilical, NPT, VM, antibiótico prévio, prematuridade, internação longa.<br><b>Agentes:</b> Staphylococcus coagulase-negativa, S. aureus, Klebsiella, Pseudomonas, Enterobacter, <b>Candida</b>."],
["Sepse","Quais sinais e sintomas você espera encontrar em um RN com sepse e como o quadro evolui se não tratado?","Inespecíficos: <b>instabilidade térmica</b>, apneia/desconforto, letargia, hipotonia, choro fraco, má perfusão (TEC &gt;3 s), taquicardia/hipotensão, <b>intolerância alimentar</b>, distensão, icterícia precoce, glicemia alterada, convulsão, sangramento. Evolução: palidez acinzentada, choque, CIVD, falência de órgãos."],
["Sepse","Quais exames você solicitaria em um RN com suspeita de sepse PRECOCE e o que você espera de cada um?","<b>Hemocultura</b> (antes do ATB) · hemograma (relação I/T &gt;0,2, leucopenia &lt;5000, neutropenia, plaquetopenia) · <b>PCR seriada</b> 24 a 48 h ou procalcitonina · gasometria, lactato, glicemia, eletrólitos · RX tórax · <b>líquor</b> se hemocultura positiva ou clínica sugestiva. Urocultura não é rotina."],
["Sepse","Quais exames você solicitaria na sepse TARDIA e o que muda em relação à precoce?","Os anteriores mais <b>urocultura</b> (sondagem/punção), <b>líquor</b> (maior chance de meningite), cultura de ponta de cateter, hemocultura pareada cateter/periférica. Procurar foco: RX abdome (NEC), RX tórax (PAV)."],
["Sepse","Qual antibiótico você inicia na sepse neonatal PRECOCE e por que essa escolha?","<b>Ampicilina + gentamicina</b> (SGB, Listeria, E. coli). Suspeita de meningite: ampicilina + cefotaxima (± gentamicina), conforme protocolo."],
["Sepse","Qual antibiótico você inicia na sepse TARDIA (provável origem hospitalar) e do que depende a escolha?","Depende da <b>flora da UTI (CCIH)</b>. Oxacilina + amicacina se baixa resistência · <b>vancomicina</b> + cefepime/ceftazidima (cateter, instável) · <b>meropenem</b> se gram-negativo resistente · considerar antifúngico (fluconazol/anfotericina) em prematuro com ATB prolongado, cateter, NPT. Descalonar pela cultura."],
["Sepse","Por quantos dias tratar sepse e meningite neonatais? Como é a profilaxia do SGB no parto e quando ela é considerada adequada?","Bacteremia 7 a 10 dias · meningite 14 dias (SGB) a 21 dias (gram-negativos).<br>Profilaxia: <b>penicilina G cristalina</b> 5 milhões UI, depois 2,5 milhões a cada 4 h; só vale se iniciada <b>≥4 h antes do parto</b>."],
["PCR","Em que situação você inicia RCP em uma criança e qual a causa mais comum de PCR nessa faixa etária?","Sem resposta, sem respiração (ou gasping) e <b>sem pulso em 10 s</b>. Também se FC &lt;60 com má perfusão. Causa mais comum: <b>hipóxia</b>, então ventilar bem."],
["PCR","Como fazer compressões de boa qualidade na criança: frequência, profundidade e relação compressão:ventilação (1 e 2 socorristas, RN)?","100 a 120/min · profundidade ≥1/3 do tórax (~4 cm lactente, ~5 cm criança) · retorno total · poucas interrupções · <b>30:2</b> (1 socorrista), <b>15:2</b> (2 socorristas) · RN <b>3:1</b>."],
["PCR","Na PCR pediátrica, quais ritmos são chocáveis, qual a carga do choque e qual a droga e dose usadas?","<b>Chocáveis (FV/TV sem pulso):</b> 2 J/kg, depois 4 J/kg, seguintes ≥4 (máx 10 J/kg). <b>Não chocáveis (assistolia/AESP):</b> adrenalina precoce.<br><b>Adrenalina 0,01 mg/kg</b> (0,1 mL/kg da 1:10.000) EV/IO a cada 3 a 5 min. Amiodarona 5 mg/kg ou lidocaína 1 mg/kg na FV/TV refratária."],
["PCR","Quais são as causas reversíveis de PCR (Hs e Ts) que você deve procurar durante a reanimação?","<b>Hs:</b> hipovolemia, hipóxia, H⁺ (acidose), hipo/hipercalemia, hipotermia, hipoglicemia.<br><b>Ts:</b> tensão (pneumotórax), tamponamento, toxinas, trombose."],
["PCR","RN que não respira ao nascer: descreva a sequência da reanimação neonatal, com FC de corte, ventilação, compressões e adrenalina.","Aquecer, posicionar, aspirar se necessário, secar. Se apneia/respiração irregular ou <b>FC &lt;100</b>: VPP 40 a 60/min, FiO₂ 21% (≥34s) ou 30% (&lt;34s). VPP eficaz e <b>FC &lt;60</b> após 30 s: 2 polegares, <b>3:1</b>, FiO₂ 100%. Adrenalina 0,01 a 0,03 mg/kg EV (via umbilical)."],
["PCR","A VPP no RN não melhora a FC. Quais passos você checa (mnemônico MR SOPA)?","<b>M</b>áscara (ajuste) · <b>R</b>eposicionar cabeça · <b>S</b>ucção · <b>O</b>pen mouth · <b>P</b>ressão (aumentar) · <b>A</b>lternativa de via aérea (IOT/máscara laríngea)."],
["Abdome agudo","Quais são as principais causas de abdome agudo no recém-nascido e qual a mais comum no prematuro?","<b>NEC</b> (mais comum no prematuro) · má rotação com volvo · atresias intestinais · íleo meconial · Hirschsprung · ânus imperfurado · perfuração espontânea."],
["Abdome agudo","Enterocolite necrosante: qual o quadro clínico, os achados no RX, o sinal de perfuração e o tratamento?","<b>Clínica:</b> distensão, resíduo bilioso, sangue nas fezes, apneia, letargia.<br><b>RX:</b> pneumatose, gás na veia porta; <b>pneumoperitônio = perfuração</b>.<br><b>Tto:</b> jejum, SOG aberta, NPT, ATB amplo (gram-negativos e anaeróbios), suporte. Cirurgia se perfuração/piora. Bell I, II, III."],
["Abdome agudo","RN com vômito bilioso: qual diagnóstico você precisa excluir primeiro, por que é urgente e qual exame pedir?","<b>Má rotação com volvo</b> até prova em contrário: emergência cirúrgica. Exame: trânsito esofagogastroduodenal (sinal do saca-rolhas)."],
["Abdome agudo","Qual doença neonatal cada sinal sugere: dupla bolha, bolha de sabão/microcólon, pneumatose/gás portal? E como se confirma Hirschsprung?","<b>Dupla bolha:</b> atresia duodenal (Down) · <b>bolha de sabão/microcólon:</b> íleo meconial (fibrose cística) · <b>pneumatose/gás portal:</b> NEC · Hirschsprung: eliminação de mecônio &gt;48 h, enema com zona de transição, <b>biópsia retal</b> confirma."],
["Nutrição","O que é o FM85, por que o prematuro precisa dele e em quais RN ele é indicado?","<b>Fortificante do leite humano</b> para prematuros: o leite materno não supre proteína, cálcio e fósforo (evita doença óssea metabólica). Em geral &lt;32s ou &lt;1500 g com dieta enteral estável (~100 mL/kg/dia). Diluição conforme bula/protocolo."],
["Nutrição","Qual a importância do zinco, o que causa sua deficiência e qual a dose na diarreia da criança?","Crescimento, imunidade e cicatrização; prematuros têm reservas baixas. Deficiência: <b>dermatite periorificial/acral, alopecia, diarreia</b>, baixo ganho de peso. Diarreia: 10 mg/dia (&lt;6 meses) ou 20 mg/dia (≥6 meses) por 10 a 14 dias."],
["Nirsevimabe","O que é o nirsevimabe, contra qual vírus ele protege, qual a dose e como difere do palivizumabe?","Anticorpo monoclonal contra a <b>proteína F do VSR</b> (imunização passiva). <b>Dose única IM:</b> 50 mg se &lt;5 kg, 100 mg se ≥5 kg. Palivizumabe: 15 mg/kg mensal. Previne bronquiolite/pneumonia graves."],
["Icterícia","Como diferenciar icterícia neonatal fisiológica de patológica (horário de início, velocidade, duração, bilirrubina direta)?","<b>Fisiológica:</b> após 24 h, pico 3º a 5º dia, some em ~2 semanas.<br><b>Patológica:</b> &lt;24 h, subida &gt;5 mg/dL/dia, BT &gt;12 a 15 no termo, &gt;2 semanas, ou <b>BD &gt;2 mg/dL (ou &gt;20% da BT)</b>."],
["Icterícia","Quais as causas de icterícia indireta e de icterícia colestática (qual urgência pensar) e como tratar?","<b>Indireta:</b> Rh/ABO, G6PD, esferocitose, cefalohematoma, policitemia, sepse, leite materno (&gt;1 semana), hipotireoidismo.<br><b>Colestática:</b> pensar em <b>atresia de vias biliares</b> (fezes acólicas, Kasai &lt;60 dias).<br><b>Tto:</b> fototerapia (luz azul) conforme curva; exsanguineotransfusão se limite ou sinais neurológicos; imunoglobulina na doença hemolítica."],
["Icterícia","O que é kernicterus, onde a bilirrubina se deposita, quais as fases clínicas (aguda e crônica) e os fatores de risco?","<b>Encefalopatia bilirrubínica:</b> BI nos núcleos da base (globo pálido).<br><b>Aguda:</b> hipotonia, sucção fraca, depois hipertonia, <b>opistótono</b>, choro agudo, apneia, convulsão.<br><b>Crônica:</b> <b>coreoatetose, surdez neurossensorial</b>, paralisia do olhar para cima, displasia do esmalte.<br>Risco: hemólise, prematuridade, sepse, acidose, hipoalbuminemia."],
["Respiratório","Síndrome do desconforto respiratório: qual a causa, quadro clínico, achado no RX, prevenção, tratamento e complicações?","<b>Déficit de surfactante</b> (pneumócito II) em prematuros. Gemência, tiragem, cianose desde as primeiras horas. RX: <b>vidro fosco com broncogramas aéreos</b>.<br>Prevenção: <b>betametasona antenatal</b> 24 a 34s. Tto: <b>CPAP precoce</b>, surfactante (poractante 200 mg/kg), cafeína.<br>Complicações: DBP, pneumotórax, HPIV, ROP, PCA."],
["Respiratório","O que é a taquipneia transitória do RN (quem acomete, evolução, RX) e como diferenciá-la da SDR?","<b>TTRN:</b> atraso na reabsorção do líquido pulmonar; termo/cesárea eletiva; taquipneia que melhora em <b>24 a 72 h</b>; RX com congestão perihilar e líquido nas cisuras; diagnóstico de exclusão; suporte.<br><b>SDR:</b> prematuro, piora nas primeiras horas, vidro fosco."],
["Acesso e ventilação","Quantos vasos tem o cordão umbilical e qual a posição correta da ponta do cateter venoso e do arterial? Qual acesso em criança maior?","Cordão: <b>1 veia</b> (calibre maior) e <b>2 artérias</b>. <b>CVU:</b> ponta na junção VCI/átrio direito (~T9-T10); em emergência, só até haver refluxo de sangue. <b>CAU:</b> alto T6-T9 ou baixo L3-L4. Criança maior sem acesso: <b>intraósseo</b> (tíbia proximal)."],
["Acesso e ventilação","Como ventilar o prematuro de forma protetora para reduzir displasia broncopulmonar?","Preferir <b>CPAP/VNI</b>, evitar volutrauma, extubar precoce, usar cafeína e surfactante conforme indicação. Objetivo: reduzir DBP."],
["Convulsão","RN com convulsão: quais as principais causas, como são as crises sutis e qual a conduta inicial (incluindo droga de 1ª linha e dose)?","<b>Causas:</b> encefalopatia hipóxico-isquêmica (24 a 72 h), hemorragia/AVC, infecção, <b>hipoglicemia, hipocalcemia</b>, Mg e Na alterados, erros inatos, abstinência.<br><b>Crises sutis:</b> mastigação, pedalar, apneia.<br><b>Conduta:</b> ABC, <b>glicemia imediata</b>, corrigir Ca/Mg; <b>fenobarbital 20 mg/kg EV</b> (1ª linha), alternativas levetiracetam, fenitoína, midazolam. EEG é o padrão-ouro."],
["Cardiopatias","Como é feito o teste do coraçãozinho (quando, onde medir), qual o resultado normal e o que fazer se falhar?","Oximetria entre <b>24 e 48 h</b>, mão direita e um pé. <b>Normal:</b> SpO₂ ≥95% e diferença &lt;3%. Falha: repetir em 1 h; se persistir, <b>ecocardiograma</b>."],
["Cardiopatias","Cite as principais cardiopatias congênitas cianóticas (os 5 Ts) e acianóticas, e diga qual é a mais comum.","<b>Cianóticas (5 Ts):</b> Tetralogia de Fallot, Transposição, Truncus, Tricúspide (atresia), Total (drenagem anômala total); também Ebstein e hipoplasia de VE.<br><b>Acianóticas:</b> <b>CIV (mais comum)</b>, CIA, PCA, DSAV, coarctação, estenoses."],
["Cardiopatias","O que é cardiopatia canal-dependente e qual droga usar? Como reconhecer e tratar Tetralogia de Fallot e Transposição das grandes artérias?","<b>Canal-dependente:</b> <b>prostaglandina E1</b> (efeito colateral: apneia).<br><b>Fallot:</b> CIV, estenose pulmonar, aorta dextroposta, hipertrofia de VD; RX em bota; crise: <b>posição genupeitoral</b>, O₂, morfina, volume, propranolol.<br><b>TGA:</b> cianose intensa sem sopro, RX em ovo deitado; prostaglandina e <b>Rashkind</b>, depois cirurgia."],
["Extras","O que o escore de Apgar avalia, em quais minutos é feito e qual sua interpretação?","FC, respiração, tônus, irritabilidade reflexa, cor (0 a 2 cada), no <b>1º e 5º minuto</b>. 8 a 10 normal; 5º min &lt;7 pede reavaliação. Não decide iniciar reanimação."],
["Extras","Como se define displasia broncopulmonar, como preveni-la e quem deve fazer triagem de retinopatia da prematuridade?","<b>DBP:</b> O₂ ou suporte ventilatório com 36 semanas corrigidas em prematuro; prevenção com CPAP, cafeína, evitar VM.<br><b>ROP:</b> triagem de fundo de olho em &lt;1500 g ou &lt;32s; evitar hiperóxia."],
["Extras","Qual o limite de glicemia que exige ação no RN e como tratar a hipoglicemia sintomática?","Glicemia &lt;45 a 47 mg/dL requer ação. Sintomático ou &lt;25: <b>bolus de SG10% 2 mL/kg</b> e infusão de glicose (VIG 6 a 8 mg/kg/min). Investigar sepse e hiperinsulinismo."]
];
var cats=["Todos"],cur=0,fil=D.map(function(_,i){return i}),on="Todos",st={};

try{st=JSON.parse(localStorage.getItem("fp")||"{}")}catch(e){}
function sv(){try{localStorage.setItem("fp",JSON.stringify(st))}catch(e){}}

function build(rev){fil=[];D.forEach(function(d,i){if((on=="Todos"||d[0]==on)&&(!rev||st[i]!==1))fil.push(i)});cur=0;show()}
function chips(){$("ch").innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c==on?" on":"");b.textContent=c;b.onclick=function(){on=c;chips();build()};$("ch").appendChild(b)})}
function show(){var k=Object.keys(st).filter(function(i){return st[i]===1}).length;
$("pb").style.width=(k/D.length*100)+"%";$("pc").textContent=k+"/"+D.length+" dominados";
$("cd").className="card";
if(!fil.length){$("ct").textContent="0 cartões";$("tg").textContent="";$("qq").textContent="Nada por aqui. Zere ou escolha outro tema 🎉";$("aa").textContent="";return}
var d=D[fil[cur]];$("ct").textContent="Cartão "+(cur+1)+" de "+fil.length;$("tg").textContent=d[0];$("qq").textContent=d[1];$("aa").innerHTML=d[2]}
function go(n){if(!fil.length)return;cur=(cur+n+fil.length)%fil.length;show()}
function mark(v){if(!fil.length)return;st[fil[cur]]=v;sv();go(1)}
$("cd").onclick=function(){$("cd").classList.toggle("f")};
$("nx").onclick=function(){go(1)};$("pv").onclick=function(){go(-1)};
$("ok").onclick=function(){mark(1)};$("no").onclick=function(){mark(0)};
$("sh").onclick=function(){fil.sort(function(){return Math.random()-.5});cur=0;show()};
$("rv").onclick=function(){build(true)};
$("rs").onclick=function(){st={};sv();build()};
$("th").onclick=function(){var r=document.documentElement,d=r.dataset.theme=="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
chips();build();
</script></body></html>
