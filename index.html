<div style="display:flex;justify-content:space-between;align-items:center"><div><h1>🩺 Pediatria · Prova Prática</h1><div class="s">Neonatologia & UTI · toque no cartão para virar</div></div><button class="b g" id="th">🌓</button></div>
<div class="chips" id="ch"></div>

<div class="card" id="cd"><div class="in"><div class="fc"><div class="tag" id="tg"></div><div class="q" id="qq"></div><div class="hint">toque para ver a resposta</div></div><div class="fc bk"><div class="tag">Resposta</div><div class="a" id="aa"></div></div></div></div>
<div class="btns"><button class="b g" id="pv">←</button><button class="b n" id="no">Revisar</button><button class="b y" id="ok">Sei!</button><button class="b g" id="nx">→</button></div>
<div class="btns" style="margin-top:8px"><button class="b g" id="sh">🔀 Embaralhar</button><button class="b g" id="rv">🔁 Só revisar</button><button class="b g" id="rs">↺ Zerar</button></div>
<p class="s" style="margin-top:14px">Material de estudo. Confirmar doses e condutas com o protocolo da UTI e os preceptores.</p>
</div>
<script>
var D=[
["Caso 28 sem","Como o RN é classificado pela idade gestacional ao nascer? Liste as faixas em semanas e diga onde cai um RN de 28 semanas.","<b>Pré-termo extremo</b> &lt;28s · <b>Muito prematuro 28 a &lt;32s (o caso)</b> · Moderado 32 a &lt;34s · Tardio 34 a &lt;37s · Termo 37 a &lt;42s · Pós-termo ≥42s"],
["Caso 28 sem","Como o RN é classificado pelo peso ao nascer? Dê o nome e o limite em gramas de cada categoria e classifique um RN de 800 g.","BPN &lt;2500 g · MBPN &lt;1500 g · <b>EBPN &lt;1000 g (o caso, 800 g)</b>"],
["Caso 28 sem","O que significam PIG, AIG e GIG? Qual ferramenta você usa para classificar e como aplicar no RN de 28 semanas com 800 g?","Plotar em curva (Fenton/Intergrowth). <b>PIG &lt;p10</b> · AIG p10 a p90 · <b>GIG &gt;p90</b>. Para 28s e 800 g, está perto do limite AIG/PIG: dizer que precisa plotar."],
["Caso 28 sem","Caso: RN de 28 semanas, 800 g, com quadro respiratório que melhorou após cafeína. Qual a sua hipótese diagnóstica e por quê?","<b>Apneia da prematuridade</b> (imaturidade do centro respiratório), frequentemente associada a <b>SDR/doença da membrana hialina</b>. A cafeína trata a apneia e ajuda na extubação."],
["Caso 28 sem","No mesmo caso (RN de 28 semanas com apneia/desconforto), quais diagnósticos diferenciais você deve citar?","Sepse/pneumonia (SGB) · TTRN · pneumotórax · hemorragia peri-intraventricular · convulsão (apneia) · cardiopatia/PCA · hipoglicemia/hipocalcemia · anemia · obstrução de via aérea"],
["Caso 28 sem","Como se define apneia da prematuridade (tempo, FC) e por que ela é um diagnóstico de exclusão?","Pausa ≥20 s, ou menor com <b>bradicardia (FC &lt;100)</b>, cianose ou palidez. <b>Diagnóstico de exclusão</b>: descartar sepse, hipoglicemia, convulsão, HPIV."],
["Caso 28 sem","Sobre a cafeína no prematuro: como ela age, quando indicar, qual a dose (ataque e manutenção) e quais os efeitos adversos?","<b>Antagonista da adenosina</b>: estimula centro respiratório, aumenta sensibilidade ao CO₂, melhora diafragma.<br>Citrato: <b>ataque 20 mg/kg</b>, manutenção 5 a 10 mg/kg/dia.<br>Indicada &lt;34s ou &lt;1500 g e para extubar. Estudo CAP: menos DBP, PCA e melhor neurodesenvolvimento.<br>Efeitos: taquicardia, irritabilidade, intolerância alimentar. Rever se FC &gt;180."],
["Caso 28 sem","Você precisa dar uma má notícia aos pais na UTI neonatal. Quais são as 6 etapas do protocolo SPIKES e o que fazer em cada uma?","<b>S</b>etting (local reservado, sentados, pais juntos) · <b>P</b>erception (o que já entendem?) · <b>I</b>nvitation (quanto querem saber?) · <b>K</b>nowledge (linguagem simples, em partes) · <b>E</b>motions (NURSE: nomear, entender, respeitar, apoiar, explorar) · <b>S</b>trategy/Summary (resumo e plano)"],
["Sepse","Qual a diferença entre sepse neonatal precoce e tardia (tempo de início e forma de aquisição)? Como reclassificar o paciente que piora após dias internado?","<b>Precoce:</b> início ≤72 h (alguns serviços 48 h), transmissão <b>vertical</b> (canal de parto).<br><b>Tardia:</b> &gt;72 h, origem <b>hospitalar</b> ou comunitária (cateter, VM, NPT, internação longa). Se o paciente piora após dias internado, reclassificar como tardia."],
["Sepse","Na sepse neonatal PRECOCE: quais os fatores de risco maternos/neonatais e quais os principais microrganismos?","<b>Fatores:</b> RPM &gt;18 h, febre materna, corioamnionite, ITU materna, SGB sem profilaxia adequada, prematuridade, BPN.<br><b>Agentes:</b> <b>SGB</b>, <b>E. coli</b>, Listeria."],
["Sepse","Na sepse neonatal TARDIA: quais os fatores de risco e quais os principais microrganismos?","<b>Fatores:</b> cateter central/umbilical, NPT, VM, antibiótico prévio, prematuridade, internação longa.<br><b>Agentes:</b> Staphylococcus coagulase-negativa, S. aureus, Klebsiella, Pseudomonas, Enterobacter, <b>Candida</b>."],
["Sepse","Quais sinais e sintomas você espera encontrar em um RN com sepse e como o quadro evolui se não tratado?","Inespecíficos: <b>instabilidade térmica</b>, apneia/desconforto, letargia, hipotonia, choro fraco, má perfusão (TEC &gt;3 s), taquicardia/hipotensão, <b>intolerância alimentar</b>, distensão, icterícia precoce, glicemia alterada, convulsão, sangramento. Evolução: palidez acinzentada, choque, CIVD, falência de órgãos."],
["Sepse","Quais exames você solicitaria em um RN com suspeita de sepse PRECOCE e o que você espera de cada um?","<b>Hemocultura</b> (antes do ATB) · hemograma (relação I/T &gt;0,2, leucopenia &lt;5000, neutropenia, plaquetopenia) · <b>PCR seriada</b> 24 a 48 h ou procalcitonina · gasometria, lactato, glicemia, eletrólitos · RX tórax · <b>líquor</b> se hemocultura positiva ou clínica sugestiva. Urocultura não é rotina."],
["Sepse","Quais exames você solicitaria na sepse TARDIA e o que muda em relação à precoce?","Os anteriores mais <b>urocultura</b> (sondagem/punção), <b>líquor</b> (maior chance de meningite), cultura de ponta de cateter, hemocultura pareada cateter/periférica. Procurar foco: RX abdome (NEC), RX tórax (PAV)."],
["Sepse","Qual antibiótico você inicia na sepse neonatal PRECOCE e por que essa escolha?","<b>Ampicilina + gentamicina</b> (SGB, Listeria, E. coli). Suspeita de meningite: ampicilina + cefotaxima (± gentamicina), conforme protocolo."],
["Sepse","Qual antibiótico você inicia na sepse TARDIA (provável origem hospitalar) e do que depende a escolha?","Depende da <b>flora da UTI (CCIH)</b>. Oxacilina + amicacina se baixa resistência · <b>vancomicina</b> + cefepime/ceftazidima (cateter, instável) · <b>meropenem</b> se gram-negativo resistente · considerar antifúngico (fluconazol/anfotericina) em prematuro com ATB prolongado, cateter, NPT. Descalonar pela cultura."],
["Sepse","Por quantos dias tratar sepse e meningite neonatais? Como é a profilaxia do SGB no parto e quando ela é considerada adequada?","Bacteremia 7 a 10 dias · meningite 14 dias (SGB) a 21 dias (gram-negativos).<br>Profilaxia: <b>penicilina G cristalina</b> 5 milhões UI, depois 2,5 milhões a cada 4 h; só vale se iniciada <b>≥4 h antes do parto</b>."],
["PCR","Em que situação você inicia RCP em uma criança e qual a causa mais comum de PCR nessa faixa etária?","Sem resposta, sem respiração (ou gasping) e <b>sem pulso em 10 s</b>. Também se FC &lt;60 com má perfusão. Causa mais comum: <b>hipóxia</b>, então ventilar bem."],
["PCR","Como fazer compressões de boa qualidade na criança: frequência, profundidade e relação compressão:ventilação (1 e 2 socorristas, RN)?","100 a 120/min · profundidade ≥1/3 do tórax (~4 cm lactente, ~5 cm criança) · retorno total · poucas interrupções · <b>30:2</b> (1 socorrista), <b>15:2</b> (2 socorristas) · RN <b>3:1</b>."],
["PCR","Na PCR pediátrica, quais ritmos são chocáveis, qual a carga do choque e qual a droga e dose usadas?","<b>Chocáveis (FV/TV sem pulso):</b> 2 J/kg, depois 4 J/kg, seguintes ≥4 (máx 10 J/kg). <b>Não chocáveis (assistolia/AESP):</b> adrenalina precoce.<br><b>Adrenalina 0,01 mg/kg</b> (0,1 mL/kg da 1:10.000) EV/IO a cada 3 a 5 min. Amiodarona 5 mg/kg ou lidocaína 1 mg/kg na FV/TV refratária."],
["PCR","Quais são as causas reversíveis de PCR (Hs e Ts) que você deve procurar durante a reanimação?","<b>Hs:</b> hipovolemia, hipóxia, H⁺ (acidose), hipo/hipercalemia, hipotermia, hipoglicemia.<br><b>Ts:</b> tensão (pneumotórax), tamponamento, toxinas, trombose."],
["PCR","RN que não respira ao nascer: descreva a sequência da reanimação neonatal, com FC de corte, ventilação, compressões e adrenalina.","Aquecer, posicionar, aspirar se necessário, secar. Se apneia/respiração irregular ou <b>FC &lt;100</b>: VPP 40 a 60/min, FiO₂ 21% (≥34s) ou 30% (&lt;34s). VPP eficaz e <b>FC &lt;60</b> após 30 s: 2 polegares, <b>3:1</b>, FiO₂ 100%. Adrenalina 0,01 a 0,03 mg/kg EV (via umbilical)."],
["PCR","A VPP no RN não melhora a FC. Quais passos você checa (mnemônico MR SOPA)?","<b>M</b>áscara (ajuste) · <b>R</b>eposicionar cabeça · <b>S</b>ucção · <b>O</b>pen mouth · <b>P</b>ressão (aumentar) · <b>A</b>lternativa de via aérea (IOT/máscara laríngea)."],
["Abdome agudo","Quais são as principais causas de abdome agudo no recém-nascido e qual a mais comum no prematuro?","<b>NEC</b> (mais comum no prematuro) · má rotação com volvo · atresias intestinais · íleo meconial · Hirschsprung · ânus imperfurado · perfuração espontânea."],
["Abdome agudo","Enterocolite necrosante: qual o quadro clínico, os achados no RX, o sinal de perfuração e o tratamento?","<b>Clínica:</b> distensão, resíduo bilioso, sangue nas fezes, apneia, letargia.<br><b>RX:</b> pneumatose, gás na veia porta; <b>pneumoperitônio = perfuração</b>.<br><b>Tto:</b> jejum, SOG aberta, NPT, ATB amplo (gram-negativos e anaeróbios), suporte. Cirurgia se perfuração/piora. Bell I, II, III."],
["Abdome agudo","RN com vômito bilioso: qual diagnóstico você precisa excluir primeiro, por que é urgente e qual exame pedir?","<b>Má rotação com volvo</b> até prova em contrário: emergência cirúrgica. Exame: trânsito esofagogastroduodenal (sinal do saca-rolhas)."],
["Abdome agudo","Qual doença neonatal cada sinal sugere: dupla bolha, bolha de sabão/microcólon, pneumatose/gás portal? E como se confirma Hirschsprung?","<b>Dupla bolha:</b> atresia duodenal (Down) · <b>bolha de sabão/microcólon:</b> íleo meconial (fibrose cística) · <b>pneumatose/gás portal:</b> NEC · Hirschsprung: eliminação de mecônio &gt;48 h, enema com zona de transição, <b>biópsia retal</b> confirma."],
["Nutrição","O que é o FM85, por que o prematuro precisa dele e em quais RN ele é indicado?","<b>Fortificante do leite humano</b> para prematuros: o leite materno não supre proteína, cálcio e fósforo (evita doença óssea metabólica). Em geral &lt;32s ou &lt;1500 g com dieta enteral estável (~100 mL/kg/dia). Diluição conforme bula/protocolo."],
["Nutrição","Qual a importância do zinco, o que causa sua deficiência e qual a dose na diarreia da criança?","Crescimento, imunidade e cicatrização; prematuros têm reservas baixas. Deficiência: <b>dermatite periorificial/acral, alopecia, diarreia</b>, baixo ganho de peso. Diarreia: 10 mg/dia (&lt;6 meses) ou 20 mg/dia (≥6 meses) por 10 a 14 dias."],
["Nirsevimabe","O que é o nirsevimabe, contra qual vírus ele protege, qual a dose e como difere do palivizumabe?","Anticorpo monoclonal contra a <b>proteína F do VSR</b> (imunização passiva). <b>Dose única IM:</b> 50 mg se &lt;5 kg, 100 mg se ≥5 kg. Palivizumabe: 15 mg/kg mensal. Previne bronquiolite/pneumonia graves."],
["Icterícia","Como diferenciar icterícia neonatal fisiológica de patológica (horário de início, velocidade, duração, bilirrubina direta)?","<b>Fisiológica:</b> após 24 h, pico 3º a 5º dia, some em ~2 semanas.<br><b>Patológica:</b> &lt;24 h, subida &gt;5 mg/dL/dia, BT &gt;12 a 15 no termo, &gt;2 semanas, ou <b>BD &gt;2 mg/dL (ou &gt;20% da BT)</b>."],
["Icterícia","Quais as causas de icterícia indireta e de icterícia colestática (qual urgência pensar) e como tratar?","<b>Indireta:</b> Rh/ABO, G6PD, esferocitose, cefalohematoma, policitemia, sepse, leite materno (&gt;1 semana), hipotireoidismo.<br><b>Colestática:</b> pensar em <b>atresia de vias biliares</b> (fezes acólicas, Kasai &lt;60 dias).<br><b>Tto:</b> fototerapia (luz azul) conforme curva; exsanguineotransfusão se limite ou sinais neurológicos; imunoglobulina na doença hemolítica."],
["Icterícia","O que é kernicterus, onde a bilirrubina se deposita, quais as fases clínicas (aguda e crônica) e os fatores de risco?","<b>Encefalopatia bilirrubínica:</b> BI nos núcleos da base (globo pálido).<br><b>Aguda:</b> hipotonia, sucção fraca, depois hipertonia, <b>opistótono</b>, choro agudo, apneia, convulsão.<br><b>Crônica:</b> <b>coreoatetose, surdez neurossensorial</b>, paralisia do olhar para cima, displasia do esmalte.<br>Risco: hemólise, prematuridade, sepse, acidose, hipoalbuminemia."],
["Respiratório","Síndrome do desconforto respiratório: qual a causa, quadro clínico, achado no RX, prevenção, tratamento e complicações?","<b>Déficit de surfactante</b> (pneumócito II) em prematuros. Gemência, tiragem, cianose desde as primeiras horas. RX: <b>vidro fosco com broncogramas aéreos</b>.<br>Prevenção: <b>betametasona antenatal</b> 24 a 34s. Tto: <b>CPAP precoce</b>, surfactante (poractante 200 mg/kg), cafeína.<br>Complicações: DBP, pneumotórax, HPIV, ROP, PCA."],
["Respiratório","O que é a taquipneia transitória do RN (quem acomete, evolução, RX) e como diferenciá-la da SDR?","<b>TTRN:</b> atraso na reabsorção do líquido pulmonar; termo/cesárea eletiva; taquipneia que melhora em <b>24 a 72 h</b>; RX com congestão perihilar e líquido nas cisuras; diagnóstico de exclusão; suporte.<br><b>SDR:</b> prematuro, piora nas primeiras horas, vidro fosco."],
["Acesso e ventilação","Quantos vasos tem o cordão umbilical e qual a posição correta da ponta do cateter venoso e do arterial? Qual acesso em criança maior?","Cordão: <b>1 veia</b> (calibre maior) e <b>2 artérias</b>. <b>CVU:</b> ponta na junção VCI/átrio direito (~T9-T10); em emergência, só até haver refluxo de sangue. <b>CAU:</b> alto T6-T9 ou baixo L3-L4. Criança maior sem acesso: <b>intraósseo</b> (tíbia proximal)."],
["Acesso e ventilação","Como ventilar o prematuro de forma protetora para reduzir displasia broncopulmonar?","Preferir <b>CPAP/VNI</b>, evitar volutrauma, extubar precoce, usar cafeína e surfactante conforme indicação. Objetivo: reduzir DBP."],
["Convulsão","RN com convulsão: quais as principais causas, como são as crises sutis e qual a conduta inicial (incluindo droga de 1ª linha e dose)?","<b>Causas:</b> encefalopatia hipóxico-isquêmica (24 a 72 h), hemorragia/AVC, infecção, <b>hipoglicemia, hipocalcemia</b>, Mg e Na alterados, erros inatos, abstinência.<br><b>Crises sutis:</b> mastigação, pedalar, apneia.<br><b>Conduta:</b> ABC, <b>glicemia imediata</b>, corrigir Ca/Mg; <b>fenobarbital 20 mg/kg EV</b> (1ª linha), alternativas levetiracetam, fenitoína, midazolam. EEG é o padrão-ouro."],
["Cardiopatias","Como é feito o teste do coraçãozinho (quando, onde medir), qual o resultado normal e o que fazer se falhar?","Oximetria entre <b>24 e 48 h</b>, mão direita e um pé. <b>Normal:</b> SpO₂ ≥95% e diferença &lt;3%. Falha: repetir em 1 h; se persistir, <b>ecocardiograma</b>."],
["Cardiopatias","Cite as principais cardiopatias congênitas cianóticas (os 5 Ts) e acianóticas, e diga qual é a mais comum.","<b>Cianóticas (5 Ts):</b> Tetralogia de Fallot, Transposição, Truncus, Tricúspide (atresia), Total (drenagem anômala total); também Ebstein e hipoplasia de VE.<br><b>Acianóticas:</b> <b>CIV (mais comum)</b>, CIA, PCA, DSAV, coarctação, estenoses."],
["Cardiopatias","O que é cardiopatia canal-dependente e qual droga usar? Como reconhecer e tratar Tetralogia de Fallot e Transposição das grandes artérias?","<b>Canal-dependente:</b> <b>prostaglandina E1</b> (efeito colateral: apneia).<br><b>Fallot:</b> CIV, estenose pulmonar, aorta dextroposta, hipertrofia de VD; RX em bota; crise: <b>posição genupeitoral</b>, O₂, morfina, volume, propranolol.<br><b>TGA:</b> cianose intensa sem sopro, RX em ovo deitado; prostaglandina e <b>Rashkind</b>, depois cirurgia."],
["Extras","O que o escore de Apgar avalia, em quais minutos é feito e qual sua interpretação?","FC, respiração, tônus, irritabilidade reflexa, cor (0 a 2 cada), no <b>1º e 5º minuto</b>. 8 a 10 normal; 5º min &lt;7 pede reavaliação. Não decide iniciar reanimação."],
["Extras","Como se define displasia broncopulmonar, como preveni-la e quem deve fazer triagem de retinopatia da prematuridade?","<b>DBP:</b> O₂ ou suporte ventilatório com 36 semanas corrigidas em prematuro; prevenção com CPAP, cafeína, evitar VM.<br><b>ROP:</b> triagem de fundo de olho em &lt;1500 g ou &lt;32s; evitar hiperóxia."],
["Extras","Qual o limite de glicemia que exige ação no RN e como tratar a hipoglicemia sintomática?","Glicemia &lt;45 a 47 mg/dL requer ação. Sintomático ou &lt;25: <b>bolus de SG10% 2 mL/kg</b> e infusão de glicose (VIG 6 a 8 mg/kg/min). Investigar sepse e hiperinsulinismo."],

["Caso 28 sem","Quais medidas antenatais melhoram o prognóstico de um prematuro extremo (corticoide e neuroproteção)? Cite drogas e doses.","<b>Betametasona</b> 12 mg IM, 2 doses com 24 h de intervalo (24 a 34s): reduz SDR, HPIV e mortalidade.<br><b>Sulfato de magnésio</b> se parto iminente &lt;32s: neuroproteção (reduz paralisia cerebral).<br>Também: ATB se RPM pré-termo, tocolítico para dar tempo ao corticoide."],
["Caso 28 sem","Como proteger o RN &lt;34 semanas da hipotermia já na sala de parto? Por que isso importa?","Sala 23 a 25 °C, <b>saco de polietileno</b> (sem secar) até o pescoço, touca, colchão térmico, berço aquecido, manipular o mínimo. Alvo de temperatura axilar <b>36,5 a 37,5 °C</b>. Hipotermia aumenta mortalidade, HPIV, hipoglicemia e acidose."],
["Caso 28 sem","Qual o momento ideal de clampeamento do cordão no prematuro vigoroso e qual o benefício?","<b>Clampeamento tardio 30 a 60 s</b> (se RN vigoroso/ respirando). Benefício: menos transfusão, menos HPIV e melhor estabilidade hemodinâmica."],
["Caso 28 sem","Qual a meta de saturação de O₂ no prematuro em oxigenoterapia e por que não manter SpO₂ alta?","<b>SpO₂ 90 a 95%</b> (e alvos de 85 a 92% nos primeiros minutos de vida, conforme minutos). Hiperóxia aumenta risco de <b>ROP, DBP</b> e estresse oxidativo; hipóxia aumenta mortalidade e NEC."],
["Caso 28 sem","Como se classifica a hemorragia peri-intraventricular (Papile), quando fazer o ultrassom transfontanela e por que é mais comum no prematuro?","<b>Grau I:</b> matriz germinativa · <b>II:</b> intraventricular sem dilatação · <b>III:</b> com dilatação ventricular · <b>IV:</b> infarto hemorrágico periventricular.<br>USTF na 1ª semana (3º a 7º dia) em &lt;1500 g ou &lt;32s e repetir. Matriz germinativa frágil e fluxo cerebral instável. Evitar flutuações de PA e manipulação excessiva."],
["Caso 28 sem","Como reconhecer e tratar a persistência do canal arterial (PCA) hemodinamicamente significativa no prematuro?","Sopro sistólico/contínuo, <b>pulsos amplos</b>, precórdio hiperdinâmico, piora respiratória, dificuldade de desmame. Confirmar com <b>ecocardiograma</b>.<br>Tto: restrição hídrica, <b>ibuprofeno</b> (10, 5 e 5 mg/kg) ou paracetamol, indometacina; cirurgia/oclusão se falha. Cuidado: oligúria, NEC e plaquetopenia com AINE."],
["Caso 28 sem","Como é a nutrição enteral inicial de um prematuro de 28 semanas e quais as metas calórica e proteica?","Dieta enteral trófica (10 a 20 mL/kg/dia) com <b>leite materno/colostro</b> nas primeiras 24 a 48 h, avanço de 20 a 30 mL/kg/dia. NPT até atingir ~120 mL/kg/dia. Metas: <b>110 a 135 kcal/kg/dia</b>, proteína <b>3,5 a 4,5 g/kg/dia</b>. Fortificar quando ~100 mL/kg/dia."],
["Caso 28 sem","Quais suplementos e prevenções de longo prazo o prematuro precisa (ferro, vitamina D, anemia)?","<b>Vitamina D 400 UI/dia</b> · <b>ferro 2 mg/kg/dia</b> a partir de 30 dias por 1 ano · avaliar anemia da prematuridade (transfusão por critérios) · eritropoetina em casos selecionados · zinco/polivitamínico conforme protocolo."],
["Caso 28 sem","Quais as etapas do Método Canguru e quais os benefícios para o prematuro?","<b>1ª etapa:</b> internação na UTI/UCI, estímulo ao contato. <b>2ª etapa:</b> canguru contínuo na unidade (mãe acompanhante). <b>3ª etapa:</b> acompanhamento ambulatorial após alta. Benefícios: vínculo, aleitamento, termorregulação, menos infecção, ganho de peso."],
["Caso 28 sem","Quais os critérios gerais de alta do prematuro?","Peso em torno de <b>≥2000 g</b> com ganho consistente · sucção coordenada/aleitamento · <b>termorregulação estável</b> · sem apneia por 5 a 7 dias · triagens feitas (teste do pezinho, orelhinha, olhinho, coraçãozinho, ROP) · vacinas · família treinada e seguimento marcado."],

["Sepse","Como se trata o choque séptico neonatal (expansão, vasoativos, corticoide)?","ABC, acesso, <b>SF 10 mL/kg</b> (repetir conforme resposta, cautela em prematuro) · ATB em até 1 h · <b>dopamina</b>/adrenalina se choque refratário · <b>hidrocortisona</b> se refratário a catecolaminas · corrigir glicemia, cálcio e acidose · suporte ventilatório."],
["Sepse","Como interpretar o líquor na meningite bacteriana neonatal e quando puncionar?","Pleocitose com neutrófilos, <b>proteína elevada, glicose baixa</b> (relação LCR/sangue &lt;0,5), cultura positiva. Puncionar na suspeita de sepse tardia, hemocultura positiva ou sinais neurológicos, quando estável. Meningite: 14 a 21 dias de ATB."],
["Sepse","Como suspeitar e tratar infecção por Candida no prematuro? Qual a profilaxia?","Fatores: &lt;1000 g, ATB de amplo espectro, cateter central, NPT com lipídio, corticoide. Hemocultura, urocultura, <b>fundo de olho, USG abdome/ecocardiograma</b>. Tto: <b>anfotericina B</b> ou fluconazol conforme cepa; retirar cateter. Profilaxia com <b>fluconazol</b> em &lt;1000 g/ UTI de alta incidência."],
["Sepse","RN assintomático de mãe com profilaxia inadequada para SGB: qual a conduta?","Observação clínica por <b>no mínimo 48 h</b> se ≥37s sem fatores adicionais; se prematuro, corioamnionite ou RPM &gt;18 h: <b>exames (hemocultura, hemograma, PCR)</b> e ATB conforme protocolo. Manter em alojamento com vigilância."],
["Sepse","Quais cuidados e nível de monitorização com gentamicina e vancomicina no RN?","<b>Gentamicina:</b> nefro e ototoxicidade; ajustar intervalo à IG, dosar nível e função renal.<br><b>Vancomicina:</b> nefrotoxicidade, infusão lenta (síndrome do homem vermelho), monitorar nível vale. Usar duração mínima necessária."],
["Sepse","Quais medidas básicas previnem infecção hospitalar na UTI neonatal (bundle)?","<b>Higiene das mãos</b> (5 momentos) · assepsia na inserção de cateter · manutenção do cateter (troca, curativos) · menor tempo de VM e cateter · aleitamento materno/colostro · evitar ATB desnecessário · limpeza de incubadoras e banho de clorexidina quando indicado."],

["PCR","Quais as diferenças na checagem de pulso e no suporte básico de vida em lactente versus criança?","Pulso <b>braquial</b> no lactente, carotídeo/femoral na criança (até 10 s). Compressões com 2 dedos ou 2 polegares (lactente), 1 ou 2 mãos (criança). Sequência <b>C-A-B</b>. Chamar ajuda: 1 minuto de RCP e depois acionar se sozinho."],
["PCR","Como escolher o tubo orotraqueal em pediatria (com e sem balonete) e qual o tamanho no RN?","Com cuff: <b>idade/4 + 3,5</b> · sem cuff: <b>idade/4 + 4</b>.<br>RN por peso: &lt;1 kg 2,5 · 1 a 2 kg 3,0 · 2 a 3 kg 3,5 · &gt;3 kg 3,5 a 4. Confirmar posição por capnografia e ausculta."],
["PCR","Qual a frequência de ventilação na PCR pediátrica com via aérea avançada e quais metas pós-parada devem ser seguidas?","<b>1 ventilação a cada 2 a 3 s</b> (20 a 30/min) com compressões contínuas.<br>Pós-PCR: evitar hipóxia e hiperóxia, manter <b>normocapnia</b>, evitar hipotensão, controle de temperatura, glicemia, tratar causa."],
["PCR","Como abordar bradicardia sintomática e taquicardia supraventricular na criança (drogas e doses)?","<b>Bradicardia:</b> ventilar/oxigenar; FC &lt;60 com má perfusão → RCP e adrenalina; atropina 0,02 mg/kg (mín 0,1 mg) se bradicardia vagal/BAV.<br><b>TSV estável:</b> manobra vagal, <b>adenosina 0,1 mg/kg</b> rápida (máx 6 mg), depois 0,2 mg/kg (máx 12). <b>Instável:</b> cardioversão sincronizada 0,5 a 1 J/kg."],
["PCR","Como reconhecer e tratar choque na criança (tipos e volume inicial)?","Taquicardia, TEC &gt;2 s, pulsos finos, oligúria, alteração de consciência; hipotensão é sinal tardio. Tipos: hipovolêmico, distributivo (séptico), cardiogênico, obstrutivo. <b>Cristaloide 10 a 20 mL/kg</b> em bolus (menor volume/cautela em cardiogênico), reavaliar, vasoativo se refratário."],
["PCR","Quais as perguntas antes do nascimento para decidir a reanimação neonatal e quando intubar?","Gestação a termo? Respira ou chora? Tônus bom? Se não, aquecer e avaliar. <b>IOT</b> se VPP com máscara ineficaz, necessidade de VPP prolongada, compressões torácicas, hérnia diafragmática ou mecônio com obstrução. Adrenalina: <b>0,01 a 0,03 mg/kg EV</b> (0,05 a 0,1 mg/kg traqueal). Volume: <b>SF 10 mL/kg</b>."],
["PCR","No líquido amniótico meconial, qual a conduta atual na reanimação do RN?","RN vigoroso: <b>não aspirar</b>, manter com a mãe. RN <b>não vigoroso</b>: seguir passos iniciais e VPP se necessário; aspiração traqueal só se houver obstrução de via aérea."],

["Abdome agudo","Como é o estadiamento de Bell da NEC e qual a conduta em cada estágio?","<b>I (suspeita):</b> sinais inespecíficos, RX normal · <b>II (definida):</b> pneumatose, jejum e ATB 7 a 14 dias · <b>IIB</b> acidose, plaquetopenia · <b>III (avançada):</b> choque, perfuração/pneumoperitônio, indicação cirúrgica."],
["Abdome agudo","Como suspeitar de atresia de esôfago e qual a forma mais comum?","Poli-hidrâmnio, <b>salivação excessiva</b>, engasgo/tosse, sonda orogástrica que não progride. Forma mais comum: <b>tipo C</b> (atresia proximal com fístula traqueoesofágica distal). Investigar <b>VACTERL</b>. RX com sonda enrolada e gás no estômago; cirurgia."],
["Abdome agudo","Diferencie gastrosquise de onfalocele e dê a conduta inicial.","<b>Gastrosquise:</b> defeito paraumbilical <b>direito, sem saco</b>, alças expostas, pouca associação com malformações.<br><b>Onfalocele:</b> defeito central <b>com saco</b>, associada a cromossomopatias e cardiopatias. Conduta: proteger com plástico/compressas estéreis mornas, SOG, hidratação, evitar perda de calor e cirurgia."],
["Abdome agudo","Como reconhecer estenose hipertrófica do piloro e qual alteração metabólica esperar?","Lactente 2 a 8 semanas com <b>vômito em jato não bilioso</b>, fome após vomitar, perda de peso, <b>oliva palpável</b>, ondas peristálticas. Laboratório: <b>alcalose metabólica hipoclorêmica e hipocalêmica</b>. Diagnóstico por USG. Tto: corrigir distúrbios e <b>piloromiotomia</b>."],
["Abdome agudo","RN com desconforto respiratório, abdome escavado e ruídos hidroaéreos no tórax: qual o diagnóstico e o que evitar?","<b>Hérnia diafragmática congênita</b> (mais comum à esquerda, Bochdalek). <b>Evitar VPP por máscara</b> (distende alças): IOT precoce, SOG aberta, hipertensão pulmonar associada, estabilizar antes da cirurgia."],
["Abdome agudo","Como reconhecer invaginação intestinal e como confirmar e tratar?","Lactente (pico 5 a 9 meses) com <b>crises de choro, vômitos, massa em salsicha</b> e fezes em <b>geleia de groselha</b>. USG: sinal do alvo. Tto: enema redutor (ar/contraste) se estável; cirurgia se peritonite, perfuração ou falha."],

["Nutrição","Quais as contraindicações ao aleitamento materno e qual a recomendação de aleitamento exclusivo?","Aleitamento exclusivo até <b>6 meses</b>, complementado até 2 anos ou mais. Contraindicações: <b>HIV</b> (no Brasil), HTLV, galactosemia no lactente, uso de drogas ilícitas/medicamentos incompatíveis. Hepatite B/C e CMV: avaliar caso a caso."],
["Nutrição","Como é a perda de peso fisiológica do RN e quando recuperar o peso de nascimento?","Perda de até <b>7 a 10%</b> no termo (até 15% em prematuro), nadir ~3º a 5º dia, recuperar em <b>10 a 14 dias</b>. Perda &gt;10% ou sem recuperação exige avaliar técnica de amamentação e desidratação."],
["Nutrição","Quais os principais componentes e complicações da NPT no prematuro?","Aminoácidos (3 a 4 g/kg/dia), lipídios (até 3 g/kg/dia), glicose (VIG), eletrólitos, vitaminas e oligoelementos. Complicações: <b>colestase</b>, hiperglicemia, infecção de cateter, distúrbios eletrolíticos, doença óssea. Iniciar nutrição enteral trófica precocemente."],
["Nutrição","Qual a profilaxia de ferro e vitamina D no lactente a termo (SBP)?","<b>Vitamina D 400 UI/dia</b> desde a 1ª semana até 12 meses (depois 600 UI). <b>Ferro 1 mg/kg/dia</b> do 3º ao 24º mês (termo, aleitamento). Prematuro: 2 mg/kg/dia a partir de 30 dias por 1 ano, depois 1 mg/kg/dia."],
["Nutrição","Como classificar a desidratação e qual a conduta de cada plano (A, B, C)?","<b>A (sem desidratação):</b> SRO após cada evacuação em casa + zinco. <b>B (alguma):</b> SRO 50 a 100 mL/kg em 4 a 6 h sob observação. <b>C (grave/choque):</b> SF ou RL EV <b>20 mL/kg</b> rápido, repetir até perfusão e depois reidratação. Reavaliar sempre."],
["Nutrição","Qual a função do banco de leite humano e como se processa o leite doado?","Coleta, seleção, processamento e distribuição de leite humano. <b>Pasteurização de Holder</b> (62,5 °C por 30 min), análise de acidez/calorias, congelamento. Indicado para prematuros e RN de risco quando o leite da mãe não é suficiente."],

["Nirsevimabe","Quais são os grupos que mais se beneficiam de nirsevimabe e por que ele pode ser mais prático que o palivizumabe?","Prematuros, cardiopatas, DBP, imunodeprimidos, lactentes na 1ª sazonalidade do VSR. Dose <b>única</b> IM cobre a sazonalidade (palivizumabe exige doses mensais). A indicação no SUS segue protocolo vigente do Ministério da Saúde."],
["Nirsevimabe","Qual a estratégia de prevenção do VSR por vacinação materna e em que idade gestacional?","Vacina de VSR para gestantes (<b>Abrysvo</b>) entre <b>32 e 36 semanas</b>, protege o RN pela passagem de anticorpos. Se a mãe foi vacinada ≥14 dias antes do parto, o RN pode não precisar de nirsevimabe, conforme norma local."],
["Vacinas e triagem","Quais vacinas o RN recebe ao nascer e qual a restrição de peso para a BCG?","<b>BCG</b> (ideal nas primeiras 12 h, peso ≥2000 g) e <b>hepatite B</b> (nas primeiras 24 h). Se prematuro &lt;2000 g, adiar a BCG até atingir o peso."],
["Vacinas e triagem","RN de mãe HBsAg positiva: qual a conduta de profilaxia?","<b>Vacina hepatite B + imunoglobulina (HBIG)</b> nas primeiras 12 a 24 h (até 7 dias), em locais diferentes. Seguir esquema vacinal e dosar anti-HBs/HBsAg pós-esquema."],
["Vacinas e triagem","Quais doenças a triagem neonatal biológica (teste do pezinho) pesquisa e quando coletar?","Coletar entre o <b>3º e 5º dia</b>: fenilcetonúria, hipotireoidismo congênito, fibrose cística, hemoglobinopatias, hiperplasia adrenal congênita, deficiência de biotinidase e outras conforme ampliação. Reteste se coleta precoce/transfusão."],
["Vacinas e triagem","Quais são as outras triagens neonatais obrigatórias e quando fazer?","<b>Teste da orelhinha</b> (24 a 48 h, até 1 mês) · <b>teste do olhinho</b> (reflexo vermelho, maternidade) · <b>coraçãozinho</b> (24 a 48 h) · <b>linguinha</b> (frênulo lingual) · ROP em &lt;1500 g/&lt;32s."],
["Vacinas e triagem","Como manejar o RN com sífilis congênita (diagnóstico e tratamento)?","Avaliar VDRL do RN vs mãe, exame físico, LCR, RX ossos e hemograma. Tratamento: <b>penicilina G cristalina 50.000 UI/kg/dose</b> EV por <b>10 dias</b> (12/12 h na 1ª semana, 8/8 h depois), conforme classificação do MS. Seguimento com VDRL."],
["Vacinas e triagem","Quais infecções congênitas compõem o TORCH e quais sinais sugerem?","Toxoplasmose, rubéola, CMV, herpes, sífilis, Zika e outras. Sinais: microcefalia, calcificações, <b>hepatoesplenomegalia, icterícia, petéquias</b>, coriorretinite, surdez, PIG. CMV: ganciclovir se sintomático; toxoplasmose: pirimetamina + sulfadiazina + ácido folínico."],
["Vacinas e triagem","Como suspeitar e tratar hipotireoidismo congênito?","Triagem no pezinho (TSH). Sinais: icterícia prolongada, hipotonia, constipação, hérnia umbilical, macroglossia, fontanela ampla. Tto: <b>levotiroxina 10 a 15 mcg/kg/dia</b> iniciada precocemente (idealmente nas 2 primeiras semanas)."],

["Icterícia","Como avaliar a icterícia pela regra de Kramer?","Progressão <b>céfalo-caudal</b>: zona 1 (cabeça e pescoço) ~5 a 6 mg/dL · zona 2 (até umbigo) 9 a 12 · zona 3 (coxas) 12 a 15 · zona 4 (pernas/braços) 15 a 18 · zona 5 (mãos e pés) &gt;18. Serve para triagem, confirmar com bilirrubina."],
["Icterícia","Como a fototerapia atua, qual o comprimento de onda e quais os efeitos adversos?","Luz azul-verde <b>460 a 490 nm</b> promove fotoisomerização e excreção da bilirrubina. Efeitos: perda hídrica, diarreia, rash, hipertermia/hipotermia, lesão ocular (proteger olhos), síndrome do bebê bronzeado (com colestase)."],
["Icterícia","Compare a doença hemolítica por Rh e por ABO e a prevenção da isoimunização Rh.","<b>Rh:</b> mãe Rh negativo sensibilizada, RN Rh positivo, Coombs direto positivo, icterícia precoce e grave, anemia/hidropsia.<br><b>ABO:</b> mãe O, RN A ou B, geralmente mais leve.<br><b>Prevenção:</b> imunoglobulina anti-D à mãe Rh negativo não sensibilizada em até 72 h."],
["Icterícia","Quais as indicações e complicações da exsanguineotransfusão?","Indicada se bilirrubina atinge o limite da curva apesar da fototerapia, ou <b>sinais de encefalopatia aguda</b>, ou anemia hemolítica grave. Complicações: hipocalcemia, hipoglicemia, infecção, trombose, plaquetopenia, enterocolite necrosante."],
["Icterícia","Como diferenciar icterícia do leite materno de icterícia por baixa ingesta (amamentação)?","<b>Baixa ingesta (1ª semana):</b> perda de peso excessiva, poucas evacuações, melhora com técnica e suplemento adequado.<br><b>Leite materno:</b> após o 7º dia, RN saudável, pode durar semanas, BD normal; manter aleitamento e observar."],

["Respiratório","Como reconhecer e tratar pneumotórax neonatal?","Desconforto súbito, assimetria torácica, MV diminuído, bulhas deslocadas, <b>transiluminação positiva</b>, RX confirma. Tensão: <b>punção</b> no 2º EIC linha hemiclavicular e depois <b>dreno torácico</b>. Fatores: VM, SDR, aspiração meconial."],
["Respiratório","Como é a síndrome de aspiração meconial e quando suspeitar de hipertensão pulmonar persistente (HPPN)?","RN pós-termo/sofrimento fetal, líquido meconial, taquipneia grave, RX com infiltrado grosseiro e hiperinsuflação. HPPN: hipoxemia refratária, <b>gradiente SpO₂ pré e pós-ductal &gt;10%</b>, ecocardiograma. Tto: VM, surfactante, <b>óxido nítrico inalatório</b> (20 ppm), sildenafil."],
["Respiratório","Quais os sinais de gravidade da bronquiolite e quais as medidas de tratamento?","VSR em &lt;2 anos: coriza, tosse, sibilos, estertores. Gravidade: <b>SpO₂ &lt;92%</b>, tiragem, apneia, recusa alimentar, idade &lt;3 meses, prematuridade/cardiopatia. Tto de suporte: oxigênio, hidratação, aspiração nasal; <b>sem rotina de broncodilatador, corticoide ou ATB</b>."],
["Respiratório","Como tratar uma crise de asma moderada/grave na criança (drogas e doses)?","<b>Salbutamol</b> spray 4 a 10 jatos com espaçador a cada 20 min por 3 doses · oxigênio se SpO₂ &lt;92% · <b>corticoide sistêmico</b> (prednisolona 1 a 2 mg/kg) · ipratrópio nas primeiras doses · sulfato de magnésio em crise grave."],
["Respiratório","Como diferenciar crupe de epiglotite e qual o tratamento do crupe?","<b>Crupe viral:</b> tosse ladrante, estridor, rouquidão, febre baixa, curso gradual. Tto: <b>dexametasona 0,15 a 0,6 mg/kg</b>, nebulização de adrenalina se estridor em repouso.<br><b>Epiglotite:</b> toxemia, febre alta, sialorreia, postura em tripé, emergência (via aérea)."],
["Respiratório","Como é a pneumonia comunitária na criança e qual o ATB de escolha?","Febre, tosse, taquipneia (OMS: &gt;50/min &lt;12 m; &gt;40/min 1 a 5 anos), tiragem. RX quando grave ou complicada. Tto ambulatorial: <b>amoxicilina</b>; internação: penicilina cristalina/ampicilina. Considerar macrolídeo em atípicos."],
["Respiratório","Quais as faixas de frequência respiratória e cardíaca normais por idade?","FR: RN 40 a 60 · lactente 30 a 53 · pré-escolar 22 a 37 · escolar 18 a 25.<br>FC: RN 120 a 160 · lactente 100 a 160 · pré-escolar 80 a 140 · escolar 70 a 120. Interpretar sempre pelo conjunto clínico."],

["Acesso e ventilação","Quais os parâmetros iniciais da ventilação mecânica no RN e metas gasométricas?","<b>PIP 15 a 20</b> cmH₂O, <b>PEEP 4 a 6</b>, FR 40 a 60, Ti 0,3 a 0,4 s, FiO₂ pela meta de SpO₂. Alvo: pH ≥7,25, PaCO₂ 45 a 55 (hipercapnia permissiva no prematuro), PaO₂ 50 a 70."],
["Acesso e ventilação","Quais as indicações de CPAP e PEEP ideal no CPAP nasal do prematuro?","Desconforto respiratório com respiração espontânea (SDR, apneia, pós-extubação). PEEP <b>5 a 6 cmH₂O</b>. Falha: FiO₂ elevada, apneia frequente, acidose → ventilar. Menos DBP que VM."],
["Acesso e ventilação","Como interpretar a gasometria: acidose respiratória versus metabólica?","<b>Resp.:</b> pH baixo + <b>PaCO₂ alta</b> → ventilar melhor.<br><b>Metabólica:</b> pH baixo + HCO₃ baixo/BE negativo → perfusão, volume, lactato, sepse, NEC.<br>Compensação respiratória rápida; metabólica lenta. Sempre correlacionar com a clínica."],
["Acesso e ventilação","O que é hipotermia terapêutica na encefalopatia hipóxico-isquêmica? Quais os critérios e o protocolo?","RN ≥36 semanas com asfixia (Apgar ≤5 aos 10 min, pH ≤7,0 ou BE ≤-16, necessidade de ventilação) + <b>encefalopatia moderada/grave (Sarnat)</b>. Iniciar em até <b>6 h</b>, temperatura <b>33 a 34 °C por 72 h</b>, reaquecimento lento (0,5 °C/h). Monitorar convulsões, glicemia e hemodinâmica."],
["Acesso e ventilação","Quais as vias de acesso vascular no RN e quando usar o PICC?","Veia periférica, <b>cateter venoso umbilical</b> (urgência/primeiros dias), <b>PICC</b> para NPT e ATB prolongados, cateter central cirúrgico. Complicações: infecção, trombose, extravasamento, perfuração."],

["Convulsão","Como classificar a encefalopatia hipóxico-isquêmica (Sarnat) e qual o prognóstico?","<b>I (leve):</b> hiperalerta, sem crises, resolução em 24 h, bom prognóstico. <b>II (moderada):</b> letargia, hipotonia, convulsões, indicação de hipotermia. <b>III (grave):</b> estupor/coma, ausência de reflexos, alta mortalidade e sequelas."],
["Convulsão","Como diferenciar convulsão febril simples de complexa e qual a conduta?","<b>Simples:</b> 6 meses a 5 anos, tônico-clônica generalizada, &lt;15 min, uma vez em 24 h. <b>Complexa:</b> focal, &gt;15 min ou recorrente. Tratar a febre/causa; investigar quando complexa ou sinais de meningite. Não precisa profilaxia contínua na simples."],
["Convulsão","Qual o algoritmo do estado de mal epiléptico na criança (drogas e doses)?","ABC, glicemia, acesso. 1ª linha: <b>benzodiazepínico</b> (midazolam 0,2 mg/kg IM/IN ou diazepam 0,3 mg/kg EV). 2ª: <b>fenitoína 20 mg/kg</b> ou fenobarbital 20 mg/kg ou levetiracetam. Refratário: UTI, infusão contínua de midazolam, tiopental/propofol."],
["Convulsão","Como tratar a hipocalcemia sintomática no RN?","<b>Gluconato de cálcio 10%</b> 1 a 2 mL/kg EV lento (10 min) com monitor cardíaco, cuidado com extravasamento. Corrigir Mg se baixo. Causas: prematuridade, asfixia, filho de mãe diabética, hipoparatireoidismo."],
["Convulsão","Como suspeitar e tratar meningite bacteriana em criança fora do período neonatal?","Febre, rigidez de nuca, vômitos, abaulamento de fontanela, petéquias. Punção lombar se estável; hemocultura. Tto empírico: <b>ceftriaxona</b> (± vancomicina) e <b>dexametasona</b> antes ou junto do ATB em Hib/pneumococo. Profilaxia de contatos (rifampicina) em meningococo."],

["Cardiopatias","Como reconhecer insuficiência cardíaca no lactente e como tratar?","Taquipneia, <b>sudorese/cansaço às mamadas</b>, baixo ganho de peso, hepatomegalia, taquicardia, ritmo de galope. Tto: <b>furosemida</b>, IECA, restrição hídrica/calórica, tratar causa (CIV grande, PCA). Cirurgia conforme cardiopatia."],
["Cardiopatias","O que é o teste de hiperóxia e como diferenciar cardiopatia de doença pulmonar?","Medir PaO₂ com <b>FiO₂ 100%</b> por 10 min. Se PaO₂ &gt;150 mmHg: provável causa pulmonar; se &lt;100 mmHg com pouca resposta: provável <b>cardiopatia cianótica</b>. Complementar com ecocardiograma."],
["Cardiopatias","Como reconhecer coarctação da aorta crítica no RN?","Choque quando o canal fecha, <b>pulsos femorais diminuídos</b>, diferença de PA entre membros superiores e inferiores, sopro. Tto: <b>prostaglandina E1</b> para reabrir o canal e cirurgia. Associada a Turner e valva aórtica bicúspide."],
["Cardiopatias","Quais os critérios diagnósticos e o tratamento da doença de Kawasaki?","Febre ≥5 dias + ≥4 de 5: <b>conjuntivite não exsudativa</b>, alterações de lábios/orofaringe, adenopatia cervical, exantema, alterações de extremidades. Tto: <b>imunoglobulina 2 g/kg</b> dose única + AAS; ecocardiograma (aneurisma coronariano)."],
["Cardiopatias","Quais os critérios de Jones para febre reumática e como é a profilaxia?","Critérios maiores: <b>cardite, poliartrite migratória, coreia, eritema marginado, nódulos subcutâneos</b>; menores: febre, artralgia, VHS/PCR elevados, PR longo. Evidência de estreptococo prévio. Tto: penicilina benzatina, AAS/prednisona; profilaxia secundária com <b>penicilina benzatina</b> mensal (600.000 UI &lt;20 kg; 1.200.000 UI ≥20 kg)."],

["Extras","Quais os marcos do desenvolvimento neuropsicomotor nos primeiros anos?","Sorriso social 2 m · sustenta a cabeça 3 a 4 m · rola 4 a 6 m · <b>senta sem apoio 6 m</b> · engatinha 9 m · pinça 9 a 10 m · <b>anda sem apoio 12 a 15 m</b> · frases de 2 palavras 2 anos."],
["Extras","Quais os reflexos primitivos do RN e quando devem desaparecer?","<b>Moro</b> (até 4 a 6 m) · sucção e busca (3 a 4 m) · preensão palmar (3 a 4 m) · preensão plantar (9 a 12 m) · marcha automática (até 2 m) · Babinski (até 12 m). Persistência ou assimetria pede investigação neurológica."],
["Extras","Como diferenciar bossa serossanguínea de cefalohematoma?","<b>Bossa:</b> edema ao nascimento, cruza suturas, some em dias. <b>Cefalohematoma:</b> hemorragia subperióstea, <b>não cruza suturas</b>, surge horas depois, dura semanas, pode causar icterícia."],
["Extras","Quais as manobras de Ortolani e Barlow e qual a conduta na displasia do desenvolvimento do quadril?","<b>Ortolani</b> reduz o quadril luxado (clique) · <b>Barlow</b> provoca a luxação. Alterados: USG de quadril (&lt;4 a 6 meses) e <b>suspensório de Pavlik</b>. Após 6 m, RX e tratamento ortopédico."],
["Extras","Quais as doses habituais de antitérmicos/analgésicos em pediatria?","<b>Paracetamol</b> 10 a 15 mg/kg/dose a cada 4 a 6 h (máx 75 mg/kg/dia) · <b>dipirona</b> 10 a 20 mg/kg/dose a cada 6 h · <b>ibuprofeno</b> 5 a 10 mg/kg/dose a cada 6 a 8 h (acima de 6 meses). Confirmar com protocolo."],
["Extras","O que é policitemia neonatal e quando tratar?","Hematócrito venoso <b>&gt;65%</b>. Sintomas: plétora, letargia, hipoglicemia, convulsão, icterícia, trombose. Tto: hidratação; <b>exsanguineotransfusão parcial</b> (troca com SF) se sintomático ou Ht muito elevado."],
["Extras","Como reconhecer e tratar a síndrome de abstinência neonatal?","Filho de mãe usuária de opioides/outras drogas: irritabilidade, tremores, choro agudo, diarreia, má sucção, sudorese, convulsão. Avaliar com <b>escore de Finnegan</b>; suporte não farmacológico e, se necessário, morfina/metadona/fenobarbital. Orientar amamentação conforme a droga."],
["Extras","Qual o manejo do RN filho de mãe diabética (riscos e monitorização)?","Riscos: <b>macrossomia, hipoglicemia, hipocalcemia, policitemia, icterícia, SDR</b>, cardiomiopatia hipertrófica, malformações. Glicemia nas primeiras horas, alimentar precocemente, tratar hipoglicemia, atenção a distúrbios eletrolíticos."]
];
var cats=["Todos"],cur=0,fil=D.map(function(_,i){return i}),on="Todos",st={};
D.forEach(function(d){if(cats.indexOf(d[0])<0)cats.push(d[0])});
try{st=JSON.parse(localStorage.getItem("fp")||"{}")}catch(e){}
function sv(){try{localStorage.setItem("fp",JSON.stringify(st))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function build(rev){fil=[];D.forEach(function(d,i){if((on=="Todos"||d[0]==on)&&(!rev||st[i]!==1))fil.push(i)});cur=0;show()}
function chips(){$("ch").innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c==on?" on":"");b.textContent=c;b.onclick=function(){on=c;chips();build()};$("ch").appendChild(b)})}
function show(){var k=Object.keys(st).filter(function(i){return st[i]===1}).length;
$("pb").style.width=(k/D.length*100)+"%";$("pc").textContent=k+"/"+D.length+" dominados";
$("cd").className="card";
if(!fil.length){$("ct").textContent="0 cartões";$("tg").textContent="";$("qq").textContent="Nada por aqui. Zere ou escolha outro tema 🎉";$("aa").textContent="";return}
var d=D[fil[cur]];$("ct").textContent="Cartão "+(cur+1)+" de "+fil.length;$("tg").textContent=d[0];$("qq").textContent=d[1];$("aa").innerHTML=d[2]}
function go(n){if(!fil.length)return;cur=(cur+n+fil.length)%fil.length;show()}
function mark(v){if(!fil.length)return;st[fil[cur]]=v;sv();go(1)}
$("cd").onclick=function(){$("cd").classList.toggle("f")};
$("nx").onclick=function(){go(1)};$("pv").onclick=function(){go(-1)};
$("ok").onclick=function(){mark(1)};$("no").onclick=function(){mark(0)};
$("sh").onclick=function(){fil.sort(function(){return Math.random()-.5});cur=0;show()};
$("rv").onclick=function(){build(true)};
$("rs").onclick=function(){st={};sv();build()};
$("th").onclick=function(){var r=document.documentElement,d=r.dataset.theme=="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
chips();build();
</script></body></html>
